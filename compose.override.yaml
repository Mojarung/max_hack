# Локально: minio/minio убран с Docker Hub, берём bitnamilegacy/minio
services:
  minio:
    image: bitnamilegacy/minio:latest
    command: !reset null
    volumes: !override
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
